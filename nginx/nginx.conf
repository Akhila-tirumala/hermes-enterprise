events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream auth_api     { server hermes_auth_api:8080; }
    upstream langfuse_ui  { server hermes_langfuse:3000; }
    upstream jaeger_ui    { server hermes_jaeger:16686; }
    upstream portainer_ui { server hermes_portainer:9000; }
    upstream grafana_ui   { server hermes_grafana:3000; }

    server {
        listen 80;
        server_name _;

        location /grafana/ {
            proxy_pass http://grafana_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
        }

        location /portainer/ {
            proxy_pass http://portainer_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
        }

        location /langfuse/ {
            proxy_pass http://langfuse_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location /jaeger/ {
            proxy_pass http://jaeger_ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://auth_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
